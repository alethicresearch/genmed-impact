# ============================================================================
# GENETIC DISEASE × GENETIC-MEDICINE IMPACT LIBRARY
# ============================================================================
# The core deliverable: a structured catalogue of serious genetic diseases,
# each mapped to (a) the gene(s)/locus that cause it, (b) inheritance mode,
# (c) approximate incidence at birth, and (d) which genetic-medicine
# interventions can address it. Aggregate burden and preventability numbers
# are DERIVED from this library (bottom-up), not asserted top-down.
#
# Honesty rules:
#   * incidence.basis is one of: cited | textbook_estimate | order_of_magnitude
#   * `cited` entries carry a source; textbook/order_of_magnitude are curated
#     placeholders to be refined by the Orphanet/GBD ingest (see DATA_NEEDED.md).
#   * Gene→disease and inheritance are well-established facts (OMIM/Orphanet).
#
# Intervention columns answer "can this tool address the disease, in principle,
# where infrastructure exists?":
#   CS  = preconception carrier screening (identifies at-risk couples)
#   PGT = IVF + preimplantation genetic testing (embryo selection)
#   PND = prenatal diagnosis (+ reproductive decision)
#   NBS = newborn screening + early therapy (MITIGATES disease, does not prevent the birth)
#   editing_unique = is germline editing the ONLY option for a typical at-risk
#                    couple? (almost always false: embryo selection works when an
#                    unaffected embryo is possible. The couple-level exceptions are
#                    quantified in the S1 residual analysis, not asserted here.)
# ============================================================================

meta:
  incidence_unit: "affected births per 100,000 live births (global, approximate unless basis=cited)"
  retrieved: "2026-08-10"
  note: >
    Seed catalogue curated from established gene–disease relationships (OMIM/Orphanet) and
    representative incidence figures. Incidence varies by ancestry and consanguinity; values are
    global order-of-magnitude anchors pending the Orphanet prevalence + GBD 2023 pulls, which the
    ingest layer will fold in per DATA_NEEDED.md.

categories:
  monogenic_recessive: "Autosomal recessive single-gene"
  monogenic_dominant: "Autosomal dominant single-gene"
  x_linked: "X-linked single-gene"
  chromosomal: "Chromosomal / structural"
  multifactorial: "Multifactorial with substantial genetic contribution"

