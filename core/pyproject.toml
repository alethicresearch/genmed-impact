[project]
name = "denominator-core"
version = "0.1.0"
description = "Reproducible global genetic-disease-burden × intervention-impact pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# `ingest` also covers the Orphanet library sync (`python -m denominator orphanet-sync`),
# which edits YAML in place with ruamel to preserve comments/formatting.
ingest = ["requests>=2.31", "pyarrow>=14.0", "ruamel.yaml>=0.17"]
test = ["pytest>=7.0"]
# builds results/Genetic_Medicine_Revision_and_Methods.docx (python results/build_revision_docx.py)
paper = ["python-docx>=1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["denominator", "denominator.ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
