# Netlify build configuration.
#
# The research page is a static Vite build in app/. The analysis pipeline is NOT run at deploy
# time: app/public/data/*.json is committed, so a deploy publishes exactly the figures that were
# reviewed, and regenerating them is a deliberate local step (`make run`) rather than a build
# side effect.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Vite uses a relative asset base so the same build can also live under GitHub Pages. When the
# Netlify SPA is requested at /v2, those relative asset/data URLs resolve under /v2; rewrite them
# back to the single built asset/data directories before the catch-all SPA rule.
[[redirects]]
  from = "/v2/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/v2/data/*"
  to = "/data/:splat"
  status = 200

[[redirects]]
  from = "/v2"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/v2/*"
  to = "/index.html"
  status = 200

# Single-page app: every other path resolves to index.html so shared deep links continue to work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Data files are regenerated by the pipeline and versioned with the site build, so they can be
# cached briefly but must not go stale for long.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
