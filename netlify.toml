# Netlify build configuration.
#
# The research page is a static Vite build in app/. The analysis pipeline is NOT run at deploy
# time: app/public/data/*.json is committed, so a deploy publishes exactly the figures that were
# reviewed, and regenerating them is a deliberate local step (`make run`) rather than a build
# side effect.

[build]
  base = "app"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every path resolves to index.html so shared deep links (?tab=funding, …) work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Data files are regenerated by the pipeline and versioned with the site build, so they can be
# cached briefly but must not go stale for long.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"
